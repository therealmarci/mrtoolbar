# Plugin-Release: beim Pushen eines Tags "plugin-mc<minecraft>-v<version>" (z.B. plugin-mc26.3-v0.1.0) ein GitHub-Release
# mit der Plugin-JAR erstellen und auf Modrinth hochladen (wenn das Secret MODRINTH_TOKEN gesetzt ist).
# Der Mod hat einen eigenen Workflow (release-mod.yml). Ablauf: docs/RELEASES.md, Kompatibilität: docs/COMPATIBILITY.md
name: Release Plugin

on:
  push:
    tags: ['plugin-mc*-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nötig, um zu prüfen, auf welchem Branch der Tag liegt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Tag mit plugin/gradle.properties abgleichen
        run: |
          prop() { grep "^$1=" gradle.properties | cut -d= -f2 | tr -d '[:space:]'; }
          VERSION=$(prop version)
          MC=$(prop mcVersion)
          FULL="mc$MC-v$VERSION"
          if [ "plugin-$FULL" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu plugin/gradle.properties (erwartet: plugin-$FULL)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MC=$MC" >> "$GITHUB_ENV"
          echo "FULL=$FULL" >> "$GITHUB_ENV"
          # 0.x und Versionen mit Suffix (1.0.0-rc.1) sind Vorabversionen.
          case "$VERSION" in
            0.*|*-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *)       echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      # Stabile Versionen kommen von main (neueste Minecraft-Version) oder vom Wartungs-Branch mc/<version>.
      # Nur stabile Plugin-Releases von main werden auf GitHub als "Latest" markiert.
      - name: Branch prüfen
        run: |
          on() { git merge-base --is-ancestor "$GITHUB_SHA" "origin/$1" 2>/dev/null; }
          LATEST=false
          if on main; then
            LATEST=true
          elif [ "$PRERELEASE" = "false" ] && ! on "mc/$MC"; then
            echo "::error::Stabile Version $FULL muss auf main oder mc/$MC getaggt werden (Vorabversionen dürfen von beta kommen)."
            exit 1
          fi
          [ "$PRERELEASE" = "true" ] && LATEST=false
          echo "LATEST=$LATEST" >> "$GITHUB_ENV"

      - name: Bauen
        run: chmod +x gradlew && ./gradlew build

      - name: Changelog-Abschnitt auslesen
        run: |
          awk -v v="$VERSION" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::Kein Abschnitt '## [$VERSION]' in plugin/CHANGELOG.md gefunden"
            exit 1
          fi
          { echo 'CHANGELOG<<EOF_CHANGELOG'; cat release-notes.md; echo 'EOF_CHANGELOG'; } >> "$GITHUB_ENV"

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          name: MRtoolbar Plugin ${{ env.VERSION }} (MC ${{ env.MC }})
          body_path: plugin/release-notes.md
          files: plugin/build/libs/MRtoolbar-${{ env.FULL }}.jar
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.LATEST }}

      - name: Auf Modrinth veröffentlichen
        if: ${{ env.MODRINTH_TOKEN != '' }}
        run: ./gradlew modrinth
