# Mod-Release: beim Pushen eines Tags "mod-mc<minecraft>-v<version>" (z.B. mod-mc26.3-v0.1.0) ein GitHub-Release mit
# der Mod-JAR erstellen. Unabhängig vom Plugin - Spieler müssen den Mod nur aktualisieren, wenn es ein neues
# Mod-Release gibt. Ablauf: docs/RELEASES.md, Kompatibilität: docs/COMPATIBILITY.md
#
# Vorher läuft die ganze Prüfrunde (checks.yml: Bauen + Tests, Bibliotheken, CodeQL) - ist etwas rot, entsteht kein
# Release. Veröffentlicht wird genau die dort gebaute und geprüfte JAR, mit Herkunftsnachweis (Attestation: GitHub
# bestätigt, dass sie aus diesem Tag gebaut wurde; prüfen mit "gh attestation verify <jar> -R therealmarci/mrtoolbar").
name: Release Mod

on:
  push:
    tags: ['mod-mc*-v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
      security-events: write

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Release anlegen
      id-token: write       # Herkunftsnachweis
      attestations: write
    defaults:
      run:
        working-directory: mod
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # nötig, um zu prüfen, auf welchem Branch der Tag liegt
          persist-credentials: false

      - name: Tag mit mod/gradle.properties abgleichen
        run: |
          prop() { grep "^$1=" gradle.properties | cut -d= -f2 | tr -d '[:space:]'; }
          VERSION=$(prop version)
          MC=$(prop minecraft_version)
          FULL="mc$MC-v$VERSION"
          if [ "mod-$FULL" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu mod/gradle.properties (erwartet: mod-$FULL)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MC=$MC" >> "$GITHUB_ENV"
          echo "FULL=$FULL" >> "$GITHUB_ENV"
          case "$VERSION" in
            0.*|*-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *)       echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      # Stabile Versionen nur von main oder mc/<version>, Vorabversionen auch von beta.
      - name: Branch prüfen
        run: |
          on() { git merge-base --is-ancestor "$GITHUB_SHA" "origin/$1" 2>/dev/null; }
          if [ "$PRERELEASE" = "false" ] && ! on main && ! on "mc/$MC"; then
            echo "::error::Stabile Version $FULL muss auf main oder mc/$MC getaggt werden (Vorabversionen dürfen von beta kommen)."
            exit 1
          fi

      - name: Geprüfte JAR aus der Prüfrunde holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MRtoolbar-mod
          path: mod/release-jar

      - name: JAR prüfen
        run: |
          JAR="release-jar/MRtoolbar-mod-$FULL.jar"
          if [ ! -f "$JAR" ]; then
            echo "::error::$JAR fehlt im Ergebnis der Prüfrunde (vorhanden: $(ls release-jar | tr '\n' ' '))"
            exit 1
          fi
          echo "JAR=mod/$JAR" >> "$GITHUB_ENV"
          sha256sum "$JAR"

      - name: Changelog-Abschnitt auslesen
        run: |
          awk -v v="$VERSION" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::Kein Abschnitt '## [$VERSION]' in mod/CHANGELOG.md gefunden"
            exit 1
          fi

      - name: Herkunftsnachweis
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.JAR }}

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: MRtoolbar Mod ${{ env.VERSION }} (MC ${{ env.MC }})
          body_path: mod/release-notes.md
          files: |
            ${{ env.JAR }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: false
