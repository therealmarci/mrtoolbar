name: 🐞 Fehler melden
description: Etwas funktioniert nicht wie erwartet.
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden! Bitte prüfe vorher mit `/mrtoolbar debug <spieler>`, ob die Verbindung zum Mod steht
        (häufigste Ursache: Mod fehlt, ist zu alt oder Fabric API ist nicht installiert).
  - type: input
    id: version
    attributes:
      label: MRtoolbar-Version (Plugin)
      description: Ausgabe von `/mrtoolbar version`
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: mod
    attributes:
      label: Mod-Version
      description: Version des MRtoolbar-Mods im Client (steht in Mod Menu oder in `/toolbar`)
      placeholder: "0.2.0"
  - type: input
    id: server
    attributes:
      label: Server-Version
      description: Ausgabe von `/version`
      placeholder: "Paper 26.3 Build 200"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert?
      description: Was hast du gemacht, was hast du erwartet, was ist stattdessen passiert?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. /toolbar öffnen, Slot 1 zum Tool-Slot machen
        2. B drücken
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Konsole / /mrtoolbar debug
      description: Relevante Konsolenausgabe (Server oder Client-Log) oder Ausgabe von `/mrtoolbar debug <spieler>`.
      render: text
  - type: textarea
    id: config
    attributes:
      label: Geänderte Config-Werte (optional)
      description: Nur die Werte, die du gegenüber dem Standard geändert hast.
      render: yaml
