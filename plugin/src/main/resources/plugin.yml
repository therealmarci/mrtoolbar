name: MRtoolbar
version: '${version}'
main: at.marcelr.mrtoolbar.MRToolbar
api-version: '${mcVersion}'
softdepend: [MRadmin]
author: _therealmarci
website: ${website}/docs/${websiteSlug}/
description: Tool slots in the hotbar with a tool belt - needs the MRtoolbar mod (Fabric).

commands:
  toolbar:
    description: Tool bar menu - set tool slots, fill belts, exceptions for sorting.
    usage: /toolbar [on|off|takeback|sort]
    aliases: [tb, tools]
  mrtoolbar:
    description: Management of MRtoolbar.
    usage: /mrtoolbar <reload|version|debug|gui|view>

permissions:
  mrtoolbar.player:
    description: All player permissions at once - e.g. for the default group in LuckPerms.
    default: op
    children:
      mrtoolbar.use: true
      mrtoolbar.sort: true
      mrtoolbar.sort.containers: true
  mrtoolbar.sort:
    description: Sort the inventory (key in the mod or button in the menu) and set your own exceptions - /toolbar sort.
    default: op
  mrtoolbar.sort.containers:
    description: Sort open chests, barrels, shulkers, hoppers etc. with the sort key (also needs mrtoolbar.sort).
    default: op
  mrtoolbar.use:
    description: Use tool slots and open /toolbar. Number of tool slots via mrtoolbar.slots.<number>, belt size via mrtoolbar.belt.<number> (max. 8).
    default: op
  mrtoolbar.admin:
    description: All admin permissions of MRtoolbar.
    default: op
    children:
      mrtoolbar.admin.reload: true
      mrtoolbar.admin.debug: true
      mrtoolbar.admin.gui: true
      mrtoolbar.admin.view: true
      mrtoolbar.admin.update: true
  mrtoolbar.admin.reload:
    description: /mrtoolbar reload
    default: op
  mrtoolbar.admin.debug:
    description: /mrtoolbar debug [player] - show a player's mod connection and tool slots.
    default: op
  mrtoolbar.admin.gui:
    description: /mrtoolbar gui - all online players with mod version and tool slots (also the MRtoolbar button in MRadmin).
    default: op
  mrtoolbar.admin.view:
    description: View other players' belts (read only) - /mrtoolbar view <player>, admin menu and MRadmin player menu.
    default: op
  mrtoolbar.admin.update:
    description: Notice when joining the server if an update is available.
    default: op
