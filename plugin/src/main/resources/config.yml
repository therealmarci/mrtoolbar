# ==============================================================================
#   MRtoolbar - Configuration
# ==============================================================================
#   After changes:   /mrtoolbar reload   (no restart needed)
#   Player menu:     /toolbar
#   Help & docs:     https://mrtechnology.marcelr.at/docs/mrtoolbar/
#
#   The tool bar only works with the MRtoolbar mod (Fabric) on the client. The mod handles keys and
#   rendering, the plugin everything to do with items. Players without the mod play normally, just without
#   the tool bar. Versions and compatibility: docs/COMPATIBILITY.md
#
#   Texts & messages: lang/de.yml or lang/en.yml.
#
#   This file is UTF-8 encoded. If special characters (ä, ö, ü) look wrong,
#   set the encoding in your editor to "UTF-8".
# ==============================================================================

# Do not change - used for automatic config updates.
config-version: 11

# Language of the texts (menus, messages). The texts are in plugins/MRtoolbar/lang/<language>.yml.
#   auto = every player gets the language set in their Minecraft client - just like the client mod.
#          German (also Austria/Switzerland) -> de.yml, everything else -> fallback-language.
#   de / en / ... = fixed language for all players.
# The console is always English. Own language: copy a file (e.g. as fr.yml) and translate it - with "auto"
# French players then get it automatically.
language: auto

# Language for players whose Minecraft language has no file of its own.
fallback-language: en


# ------------------------------------------------------------------------------
#   1) TOOL SLOTS & BELTS
# ------------------------------------------------------------------------------
toolbar:
  # How many hotbar slots each player may turn into tool slots (0-9).
  # More via the permission "mrtoolbar.slots.<number>" (e.g. mrtoolbar.slots.3, the highest counts).
  default-tool-slots: 2

  # How many tools fit into the belt of a tool slot (1-8, the wheel has 8 fields).
  # The tool currently in the hotbar does not count.
  # More via the permission "mrtoolbar.belt.<number>" (e.g. mrtoolbar.belt.8).
  default-belt-size: 6

  # What may go into a belt. Entries:
  #   item name         e.g. bow, shears, minecraft:fishing_rod
  #   #item tag         e.g. #minecraft:pickaxes (all pickaxes)
  #   "*"               any item
  allowed-items:
    - "#minecraft:pickaxes"
    - "#minecraft:axes"
    - "#minecraft:shovels"
    - "#minecraft:hoes"
    - "#minecraft:swords"
    - "#minecraft:spears"
    - mace
    - trident
    - bow
    - crossbow
    - shield
    - fishing_rod
    - shears
    - flint_and_steel
    - brush
    - spyglass
    - carrot_on_a_stick
    - warped_fungus_on_a_stick

  # Worlds in which tool slots work like normal slots (name, case does not matter).
  # The belts are kept.
  disabled-worlds: []

  # What happens to the contents of the belts on death:
  #   drop = dropped on the ground like the inventory (default)
  #   keep = stays in the belt
  # If keepInventory is on in the world, the belt is always kept.
  on-death: drop

  # Pause in MRadmin's admin mode (tool slots act normally, /toolbar locked, belt kept on death).
  # The admin mode has its own creative inventory - without the pause, creative items could end up in the belt.
  pause-in-admin-mode: true

  # Pause in MRpvp duels (also in the arena editor and while spectating). MRpvp saves the whole inventory
  # including the selected tool and gives it back exactly like that - the tool bar must not move anything in between.
  pause-in-pvp: true


# ------------------------------------------------------------------------------
#   2) INVENTORY SORTING
# ------------------------------------------------------------------------------
#   Key in the mod (Options → Controls → MRtoolbar → "Sort inventory", default: middle mouse button) - works in
#   open inventories and chests. Every player sets their own exceptions: /toolbar → hopper, or /toolbar sort
#   (the menu also has a "Sort now" button that works without the mod).
#   Never sorted: tool slots, armour, off-hand, the item on the cursor.
#   Permission: mrtoolbar.sort
sorting:
  enabled: true

  # Order until a player picks one themselves:
  #   type   = Minecraft order (blocks, then items - same things end up together)
  #   name   = alphabetical by item name (English ID)
  #   amount = what you have most of first
  default-mode: type

  # Slots a player has locked as long as they do not change their exceptions themselves. Entries:
  #   hotbar           the whole hotbar
  #   hotbar-<1-9>     one hotbar slot
  #   inventory        all 27 inventory slots
  #   inventory-<1-27> one inventory slot (row by row from the top left)
  default-locked:
    - hotbar

  # Minimum time between two sorts of a player (ticks, 20 = 1 second, 0 = none).
  cooldown-ticks: 10

  # Containers that can be sorted with the sort key (mouse over the container). Permission:
  # mrtoolbar.sort.containers. Empty list = only the player's own inventory.
  #   chest       chest, double chest, trapped chest, minecart with chest, chest boat
  #   barrel      barrel
  #   shulker_box shulker box
  #   ender_chest the player's own ender chest
  #   hopper      hopper, minecart with hopper
  #   dispenser   dispenser
  #   dropper     dropper
  # Plugin menus (e.g. /toolbar, MRadmin) are never affected, even if they look like chests.
  containers:
    - chest
    - barrel
    - shulker_box
    - ender_chest
    - hopper
    - dispenser
    - dropper


# ------------------------------------------------------------------------------
#   3) CLIENT MOD
# ------------------------------------------------------------------------------
mod:
  # Oldest version of the MRtoolbar mod that is still allowed (e.g. "0.2.1", empty = any compatible version).
  # Which mod versions fit the plugin in principle is built into the plugin (protocol version) - here you
  # can additionally lock out older versions, e.g. because of a bug in the mod.
  minimum-version: ""

  # Where players download the mod (link in the notices).
  download-url: "https://mrtechnology.marcelr.at/download/mrtoolbar/"

  # How long the server waits for the mod after joining before the player counts as "without mod" (seconds).
  handshake-seconds: 5


# ------------------------------------------------------------------------------
#   4) UPDATE CHECK
# ------------------------------------------------------------------------------
update-checker:
  enabled: true
  # Source: "github" (GitHub Releases, default) or "modrinth"
  source: github
  # Also report beta/alpha versions. If a pre-release (0.x) is running, they are always reported.
  include-prereleases: false
  interval-hours: 6
  # Notify players with "mrtoolbar.admin.update" when they join the server.
  notify-on-join: true


# ------------------------------------------------------------------------------
#   5) MENUS
# ------------------------------------------------------------------------------
gui:
  # How often open menus are refreshed (in ticks, 20 = 1 second).
  refresh-ticks: 20
  sounds: true
